name: Apply follow-along cursor refactor

on:
  push:
    branches:
      - agent/rebuild-follow-along-cursor
    paths:
      - .github/workflows/apply-follow-along-refactor.yml
      - scripts/apply-follow-along-refactor.py
      - scripts/fix-follow-along-lint.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-follow-along-refactor.yml
      - scripts/apply-follow-along-refactor.py
      - scripts/fix-follow-along-lint.py
      - frontend/src/followAlong/**
      - frontend/tests/followAlongPlayback.test.mjs

permissions:
  contents: write

jobs:
  refactor-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cursor branch
        uses: actions/checkout@v4
        with:
          ref: agent/rebuild-follow-along-cursor
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Apply guarded migration
        shell: bash
        run: |
          set -o pipefail
          : > cursor-refactor-ci.log
          python scripts/apply-follow-along-refactor.py 2>&1 | tee -a cursor-refactor-ci.log
          python scripts/fix-follow-along-lint.py 2>&1 | tee -a cursor-refactor-ci.log

      - name: Install dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a cursor-refactor-ci.log
          npm --prefix frontend ci 2>&1 | tee -a cursor-refactor-ci.log

      - name: Frontend tests
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend test 2>&1 | tee -a cursor-refactor-ci.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run typecheck 2>&1 | tee -a cursor-refactor-ci.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run lint 2>&1 | tee -a cursor-refactor-ci.log

      - name: Production build
        shell: bash
        run: |
          set -o pipefail
          npm --prefix frontend run build 2>&1 | tee -a cursor-refactor-ci.log
          git diff --check 2>&1 | tee -a cursor-refactor-ci.log

      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: follow-along-refactor-diagnostics
          if-no-files-found: error
          retention-days: 7
          path: |
            cursor-refactor-ci.log
            frontend/src/components/ReflowViewer.tsx
            frontend/src/followAlong
            frontend/tests/followAlongPlayback.test.mjs

      - name: Commit validated implementation
        if: success()
        shell: bash
        run: |
          rm -f scripts/apply-follow-along-refactor.py
          rm -f scripts/fix-follow-along-lint.py
          rm -f .github/workflows/apply-follow-along-refactor.yml
          rm -f cursor-refactor-ci.log
          git config user.name "folio-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild follow-along cursor architecture"
          git push origin HEAD:agent/rebuild-follow-along-cursor
