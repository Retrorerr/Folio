name: Release installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: folio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate versions and release state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          android_version="$(node -p "require('./src-tauri/tauri.android.conf.json').version")"
          cargo_version="$(awk '/^\[package\]/{package=1; next} package && /^version = / {gsub(/version = |\"/, ""); print; exit}' src-tauri/Cargo.toml)"

          for version in "$desktop_version" "$android_version" "$cargo_version"; do
            if [[ "$version" != "$package_version" ]]; then
              echo "Release versions disagree: npm=$package_version desktop=$desktop_version android=$android_version cargo=$cargo_version" >&2
              exit 1
            fi
          done

          tag="v$package_version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            publish=false
            echo "$tag already exists; there is nothing new to publish."
          else
            publish=true
            echo "$tag will be built and published."
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

  windows:
    name: Build Windows installers
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build and verify installers
        shell: pwsh
        run: |
          $env:FOLIO_PYTHON = (Get-Command python -ErrorAction Stop).Source
          & .\scripts\build-tauri.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }

          $output = Join-Path $PWD 'release-assets\windows'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installers = @(
            Get-ChildItem 'src-tauri\target\release\bundle\nsis' -File -Filter '*.exe' -ErrorAction SilentlyContinue
            Get-ChildItem 'src-tauri\target\release\bundle\msi' -File -Filter '*.msi' -ErrorAction SilentlyContinue
          )
          if (($installers | Measure-Object).Count -lt 2) {
            throw 'Expected both NSIS and MSI Windows installers.'
          }
          $installers | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $output -Force }

      - name: Upload Windows installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installers
          path: release-assets/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Build signed Android installer
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CI: true
      FOLIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIO_ANDROID_KEYSTORE_BASE64 }}
      FOLIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEYSTORE_PASSWORD }}
      FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
      FOLIO_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEY_PASSWORD }}
      FOLIO_ANDROID_KEYSTORE_TYPE: ${{ secrets.FOLIO_ANDROID_KEYSTORE_TYPE }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android native toolchains
        shell: pwsh
        run: |
          sdkmanager.bat 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          if ($LASTEXITCODE -ne 0) { throw "Android SDK setup failed with exit code $LASTEXITCODE" }

          $ndk = Join-Path $env:ANDROID_SDK_ROOT 'ndk\27.2.12479018'
          if (-not (Test-Path -LiteralPath $ndk -PathType Container)) { throw "Android NDK was not installed at $ndk" }
          "NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root npm install failed.' }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend npm install failed.' }

          python -m venv backend\.venv
          & .\backend\.venv\Scripts\python.exe -m pip install --disable-pip-version-check 'espeakng-loader==0.2.4'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned eSpeak data install failed.' }

      - name: Restore Android release signing key
        shell: pwsh
        run: |
          $required = @(
            'FOLIO_ANDROID_KEYSTORE_BASE64',
            'FOLIO_ANDROID_KEYSTORE_PASSWORD',
            'FOLIO_ANDROID_KEY_ALIAS',
            'FOLIO_ANDROID_KEY_PASSWORD'
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Required Android Actions secrets are missing: $($missing -join ', ')"
          }

          try {
            $bytes = [Convert]::FromBase64String($env:FOLIO_ANDROID_KEYSTORE_BASE64.Trim())
          } catch {
            throw 'FOLIO_ANDROID_KEYSTORE_BASE64 is not valid base64.'
          }
          if ($bytes.Length -eq 0) { throw 'The decoded Android keystore is empty.' }

          $keystore = Join-Path $env:RUNNER_TEMP 'folio-android-release.keystore'
          [IO.File]::WriteAllBytes($keystore, $bytes)
          "FOLIO_ANDROID_KEYSTORE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build and verify Android release
        shell: pwsh
        run: |
          npm run android:build
          if ($LASTEXITCODE -ne 0) { throw "Android packaging failed with exit code $LASTEXITCODE" }

          $version = '${{ needs.metadata.outputs.version }}'
          $delivery = Join-Path $PWD 'dist\android\release'
          $output = Join-Path $PWD 'release-assets\android'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $required = @(
            "Folio-$version-universal-release.apk",
            "Folio-$version-universal-release.aab",
            "Folio-$version-espeak-corresponding-source.zip",
            'build-manifest.json'
          )
          foreach ($name in $required) {
            $source = Join-Path $delivery $name
            if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or (Get-Item -LiteralPath $source).Length -eq 0) {
              throw "Required Android release artifact is missing or empty: $source"
            }
            Copy-Item -LiteralPath $source -Destination $output -Force
          }

      - name: Upload Android installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-installer
          path: release-assets/android/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, windows, android]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets

      - name: Publish release and checksums
        shell: bash
        run: |
          set -euo pipefail

          version='${{ needs.metadata.outputs.version }}'
          tag="v$version"
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} < 6 )); then
            echo "Expected Windows and Android release assets; found ${#assets[@]}." >&2
            exit 1
          fi

          (
            cd release-assets
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > SHA256SUMS
          assets+=(SHA256SUMS)

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Folio $version" \
            --generate-notes \
            --latest
