name: Release installers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: folio-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FOLIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIO_ANDROID_KEYSTORE_BASE64 }}
      FOLIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEYSTORE_PASSWORD }}
      FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
      FOLIO_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEY_PASSWORD }}
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate versions and release state
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"
          desktop_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          android_version="$(node -p "require('./src-tauri/tauri.android.conf.json').version")"
          cargo_version="$(awk '/^\[package\]/{package=1; next} package && /^version = / {gsub(/version = |\"/, ""); print; exit}' src-tauri/Cargo.toml)"
          backend_version="$(sed -n "s/.*StringStruct('ProductVersion', '\([^']*\)')/\1/p" backend/windows-version-info.txt)"

          for version in "$desktop_version" "$android_version" "$cargo_version" "$backend_version"; do
            if [[ "$version" != "$package_version" ]]; then
              echo "Release versions disagree: npm=$package_version desktop=$desktop_version android=$android_version cargo=$cargo_version backend=$backend_version" >&2
              exit 1
            fi
          done

          tag="v$package_version"
          if git ls-remote --exit-code origin "refs/tags/$tag" >/dev/null 2>&1; then
            publish=false
            echo "$tag already exists; there is nothing new to publish."
          else
            publish=true
            echo "$tag will be built and published."
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Require Android release credentials
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          for name in \
            FOLIO_ANDROID_KEYSTORE_BASE64 \
            FOLIO_ANDROID_KEYSTORE_PASSWORD \
            FOLIO_ANDROID_KEY_ALIAS \
            FOLIO_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error title=Android release signing is not configured::Missing repository secrets: ${missing[*]}"
            exit 1
          fi

  windows:
    name: Build Windows installers
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Build and verify installers
        shell: pwsh
        run: |
          $env:FOLIO_PYTHON = (Get-Command python -ErrorAction Stop).Source
          & .\scripts\build-tauri.ps1
          if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed with exit code $LASTEXITCODE" }

          $output = Join-Path $PWD 'release-assets\windows'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $installers = @(Get-ChildItem 'src-tauri\target\release\bundle\nsis' -File -Filter 'Folio_*_x64-setup.exe' -ErrorAction SilentlyContinue)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one normal x64 EXE installer, found $($installers.Count)."
          }
          $installers | ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $output -Force }

      - name: Upload Windows installers
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: windows-installers
          path: release-assets/windows/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  android:
    name: Build signed Android installer
    needs: metadata
    if: needs.metadata.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CI: true
      FOLIO_ANDROID_KEYSTORE_BASE64: ${{ secrets.FOLIO_ANDROID_KEYSTORE_BASE64 }}
      FOLIO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEYSTORE_PASSWORD }}
      FOLIO_ANDROID_KEY_ALIAS: ${{ secrets.FOLIO_ANDROID_KEY_ALIAS }}
      FOLIO_ANDROID_KEY_PASSWORD: ${{ secrets.FOLIO_ANDROID_KEY_PASSWORD }}
      FOLIO_ANDROID_KEYSTORE_TYPE: ${{ secrets.FOLIO_ANDROID_KEYSTORE_TYPE }}
    steps:
      - name: Check out the release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore Android release signing key
        shell: pwsh
        run: |
          $required = @(
            'FOLIO_ANDROID_KEYSTORE_BASE64',
            'FOLIO_ANDROID_KEYSTORE_PASSWORD',
            'FOLIO_ANDROID_KEY_ALIAS',
            'FOLIO_ANDROID_KEY_PASSWORD'
          )
          $missing = @($required | Where-Object { -not [Environment]::GetEnvironmentVariable($_) })
          if ($missing.Count -gt 0) {
            throw "Required Android Actions secrets are missing: $($missing -join ', ')"
          }

          try {
            $bytes = [Convert]::FromBase64String($env:FOLIO_ANDROID_KEYSTORE_BASE64.Trim())
          } catch {
            throw 'FOLIO_ANDROID_KEYSTORE_BASE64 is not valid base64.'
          }
          if ($bytes.Length -eq 0) { throw 'The decoded Android keystore is empty.' }

          $keystore = Join-Path $env:RUNNER_TEMP 'folio-android-release.keystore'
          [IO.File]::WriteAllBytes($keystore, $bytes)
          "FOLIO_ANDROID_KEYSTORE=$keystore" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate Android native toolchains
        shell: pwsh
        run: |
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } elseif ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $null }
          if (-not $sdk -or -not (Test-Path -LiteralPath $sdk -PathType Container)) {
            throw 'The hosted runner did not provide a usable Android SDK.'
          }

          $ndk = @($env:ANDROID_NDK_HOME, $env:ANDROID_NDK_ROOT, $env:ANDROID_NDK) |
            Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) } |
            Select-Object -First 1
          if (-not $ndk) {
            $ndk = Get-ChildItem (Join-Path $sdk 'ndk') -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^27\.' } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $ndk) { throw 'Android NDK r27 was not found on the hosted runner.' }

          foreach ($requiredPath in @(
            (Join-Path $sdk 'platform-tools\adb.exe'),
            (Join-Path $sdk 'platforms\android-36\android.jar'),
            (Join-Path $sdk 'build-tools\36.0.0\zipalign.exe'),
            (Join-Path $ndk 'build\cmake\android.toolchain.cmake')
          )) {
            if (-not (Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required Android tool is missing: $requiredPath"
            }
          }

          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NDK_HOME=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android

      - name: Install build dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Root npm install failed.' }
          npm --prefix frontend ci
          if ($LASTEXITCODE -ne 0) { throw 'Frontend npm install failed.' }

          python -m venv backend\.venv
          & .\backend\.venv\Scripts\python.exe -m pip install --disable-pip-version-check 'espeakng-loader==0.2.4'
          if ($LASTEXITCODE -ne 0) { throw 'Pinned eSpeak data install failed.' }

      - name: Build and verify Android release
        shell: pwsh
        run: |
          npm run android:build
          if ($LASTEXITCODE -ne 0) { throw "Android packaging failed with exit code $LASTEXITCODE" }

          $version = '${{ needs.metadata.outputs.version }}'
          $delivery = Join-Path $PWD 'dist\android\release'
          $output = Join-Path $PWD 'release-assets\android'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $apk = Join-Path $delivery "Folio-$version-universal-release.apk"
          if (-not (Test-Path -LiteralPath $apk -PathType Leaf) -or (Get-Item -LiteralPath $apk).Length -eq 0) {
            throw "Required universal Android APK is missing or empty: $apk"
          }
          Copy-Item -LiteralPath $apk -Destination $output -Force

      - name: Upload Android installer
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: android-installer
          path: release-assets/android/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [metadata, windows, android]
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified installers
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: release-assets

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail

          version='${{ needs.metadata.outputs.version }}'
          tag="v$version"
          mapfile -d '' assets < <(find release-assets -type f -print0 | sort -z)
          if (( ${#assets[@]} != 2 )); then
            echo "Expected exactly one normal EXE and one universal APK; found ${#assets[@]} assets." >&2
            exit 1
          fi

          exe_count=0
          apk_count=0
          for asset in "${assets[@]}"; do
            case "$(basename "$asset")" in
              Folio_*_x64-setup.exe) exe_count=$((exe_count + 1)) ;;
              Folio-*-universal-release.apk) apk_count=$((apk_count + 1)) ;;
              *) echo "Unexpected release asset: $asset" >&2; exit 1 ;;
            esac
          done
          if (( exe_count != 1 || apk_count != 1 )); then
            echo "Expected one normal EXE and one universal APK; found exe=$exe_count apk=$apk_count." >&2
            exit 1
          fi

          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Folio $version" \
            --generate-notes \
            --latest
