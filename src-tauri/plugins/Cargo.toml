[package]
name = "tauri-plugin-mobile-runtime"
version = "0.1.0"
authors = [ "Folio" ]
description = "Android-native local storage, document picking, and audio bridge for Folio"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-mobile-runtime"

[dependencies]
tauri = { version = "2.10.3", default-features = false }
serde = "1.0"
serde_json = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.4", features = ["build"] }
